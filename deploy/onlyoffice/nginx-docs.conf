# /etc/nginx/sites-available/docs.inverconstruccion.com
# Proxy HTTPS hacia el contenedor de ONLYOFFICE (127.0.0.1:8085). Certbot agrega el bloque 443.
map $http_upgrade $oo_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name docs.inverconstruccion.com;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $oo_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

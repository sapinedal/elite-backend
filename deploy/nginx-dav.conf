# Unidad de red de Gestión Documental (WebDAV): fragmentos para el server block de elite.inverconstruccion.com

# 1) Dentro de `location ^~ /api { ... }`: el Finder de macOS consulta por cada archivo su "._nombre" (y .DS_Store,
#    .Spotlight-V100…). Nunca existen en Spaces, así que las lecturas se responden aquí con 404 sin pasar por PHP.
#    Las escrituras siguen a PHP, que las descarta (DavTemporaryFilesPlugin).
    location ~ ^/api/dav/(?:.*/)?(?:\._[^/]*|\.DS_Store|\.hidden|\.localized|\.metadata_never_index[^/]*|\.Spotlight-V100|\.Trashes|\.fseventsd|\.TemporaryItems|\.ql_[^/]*|Thumbs\.db|desktop\.ini)/?$ {
        access_log off;
        if ($request_method ~ ^(GET|HEAD|PROPFIND|DELETE)$) {
            return 404;
        }
        try_files $uri /index.php?$query_string;
    }

# 2) A nivel del server block: descarga directa desde Spaces. PHP valida el permiso y responde
#    X-Accel-Redirect: /_dav_download con la URL firmada en X-Dav-Download-Url (DOCUMENTAL_DAV_ACCEL=true).
#    nginx reenvía el Range del cliente, así abrir y previsualizar archivos grandes no pasa por PHP.
    location = /_dav_download {
        internal;
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $dav_download_url $upstream_http_x_dav_download_url;
        set $dav_etag $upstream_http_x_dav_etag;
        proxy_pass $dav_download_url;
        proxy_ssl_server_name on;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_buffering off;
        proxy_hide_header ETag;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-rgw-object-type;
        proxy_hide_header Set-Cookie;
        add_header ETag $dav_etag always;
    }
